exclude:
  platforms:
    - "_non_rom"
  roms:
    single_file:
      # Drop .m3u playlist files — they duplicate the .chd entries.
      # Emulators read .m3u for disc swapping; RomM doesn't need them for matching.
      extensions:
        - "m3u"
    multi_file:
      # Exclude unpacked Wii U games that need conversion to .wua
      names:
        - "The Legend of Zelda Breath of the Wild [Game] [00050000101c9400]"
        - "DLC"
